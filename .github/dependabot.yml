version: 2
updates:
  # Web components (React / TypeScript / webpack toolchain)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # Gradle (SDK plugin + module deps)
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions used by the CI / release workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
