version: 2
updates:
  # Root lint workspace (ESLint + typescript-eslint). Separate from /web: it
  # ships nothing, so majors here are safe to take automatically.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Web components (React / TypeScript / webpack toolchain)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # React is pinned at 16 (Perspective's runtime). Several UI libs' latest
      # majors need React 18 (react-markdown 5+) or are breaking rewrites
      # (TipTap 3), and major dev-tooling bumps (jest 30, sass-loader 17, …)
      # break the build. Take majors DELIBERATELY, not automatically — minor,
      # patch, and security updates still flow.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Gradle (SDK plugin + module deps)
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions used by the CI / release workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
