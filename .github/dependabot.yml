version: 2
updates:
  # Root lint workspace (ESLint + typescript-eslint + plugins). Separate from
  # /web: it ships nothing, so majors here are safe to take automatically — a
  # breaking one is a red Lint check, not a shipped regression.
  #
  # Grouped because these packages are peer-locked to each other and CANNOT
  # move independently: `@eslint/js@10` declares `peerDependencies:
  # {eslint: ^10.0.0}`, so a lone bump of either is unmergeable by
  # construction, and eslint-plugin-react's peer range gates the whole set.
  # Ungrouped, dependabot opened two permanently-red PRs (#86, #88) for one
  # upgrade. One PR that goes green when the ecosystem is ready is the point.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint-plugin-*"

  # Web components (React / TypeScript / webpack toolchain)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # React is pinned at 16 (Perspective's runtime). Several UI libs' latest
      # majors need React 18 (react-markdown 5+) or are breaking rewrites
      # (TipTap 3), and major dev-tooling bumps (jest 30, sass-loader 17, …)
      # break the build. Take majors DELIBERATELY, not automatically — minor,
      # patch, and security updates still flow.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Gradle (SDK plugin + module deps)
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions used by the CI / release workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
