name: Release

# A release is a git tag `vX.Y.Z`. Pushing the tag builds + signs the module,
# then publishes a GitHub Release with the signed .modl attached and the
# matching CHANGELOG section as the notes. The tag drives the module version.
#
# A tag `vX.Y.Z-ignition<sdk>`, such as v0.9.1-ignition2027.2.0-beta1, instead
# publishes a build for that Ignition beta as a GitHub PRERELEASE: built on that
# SDK and Java 25, labelled BETA in its file and module names, and never marked
# as the latest release. See RELEASING.md.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE_B64       base64 of the signing keystore (.p12/.jks)
#   SIGNING_CERT_B64           base64 of the certificate chain (.pem)
#   SIGNING_KEYSTORE_PASSWORD  keystore password
#   SIGNING_CERT_ALIAS         key alias inside the keystore
#   SIGNING_CERT_PASSWORD      key password (often == keystore password)
# See RELEASING.md.

on:
  push:
    tags:
      - 'v*'
  # Manual trigger, ALWAYS a dry run: validates signing (and the whole
  # build+sign path), uploads the signed .modl as a workflow artifact and never
  # creates a GitHub Release. Only a pushed tag publishes. There used to
  # be a dry_run checkbox; unticked on a branch it tagged the branch name
  # (e.g. `main`) and published a release from it (#118).
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp: x.y.z, or x.y.z-ignition<beta sdk> (dry run; no tag involved)'
        default: '0.0.0'
        type: string

# Read-only by default; only the job that publishes gets write access.
permissions:
  contents: read

jobs:
  # The user manual is its own job because building it runs code fetched at
  # build time (npx md-to-pdf, @puppeteer/browsers, Chrome for Testing). Here
  # it runs on a separate runner that never sees the signing secrets and only
  # holds a read-only token. Moving the step earlier in the signing job would
  # not be enough: a step can write $GITHUB_ENV / $GITHUB_PATH or the Gradle
  # home and so run code in the later signing step.
  prepare:
    name: Version & user manual
    runs-on: ubuntu-latest
    # Normal runs take under a minute; a hung download should not run for hours.
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read   # the beta gate reads the 2027 job's result on this commit
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
      release_version: ${{ steps.ver.outputs.release_version }}
      sdk: ${{ steps.ver.outputs.sdk }}
      java: ${{ steps.ver.outputs.java }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Derive version + publish flag
        id: ver
        env:
          # Through env, never as an expression inside the script: a typed
          # version is arbitrary text and would otherwise be run as shell.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Only a tag push publishes; a manual run is always a dry run.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="$INPUT_VERSION"
            publish=false
          fi
          # Policy: plain x.y.z for a normal release, or x.y.z-ignition<sdk> for
          # a build against an Ignition beta SDK. Any other suffix is rejected.
          # Ignition's module.xml version parser is numeric-only: a prerelease
          # suffix (v0.4.0-beta.1) reaching it produces a .modl the gateway
          # rejects at install (a class of failure the observability module
          # shipped once), so a beta build maps to the numeric x.y.z.<beta>
          # through -PreleaseVersion=x.y.z-beta.<beta> (build.gradle.kts).
          # A bash match covers the whole string, so a typed value with a
          # newline cannot slip an extra line into $GITHUB_OUTPUT (a line-based
          # grep would pass it as long as one line looked valid).
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_version="$version"
            sdk=""
            java="17"
            prerelease=false
          elif [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-ignition([0-9]{4}\.[0-9]+\.[0-9]+-beta([0-9]+))$ ]]; then
            release_version="${BASH_REMATCH[1]}-beta.${BASH_REMATCH[3]}"
            sdk="${BASH_REMATCH[2]}"
            java="25"
            prerelease=true
          else
            shown="$(printf '%s' "$version" | tr -c '[:alnum:]._-' '?')"
            echo "::error::Version '$shown' is neither plain x.y.z nor x.y.z-ignition<year>.<x>.<y>-beta<n>. Other prerelease suffixes break Ignition's numeric module version parser. Bump the patch number instead."
            exit 1
          fi
          {
            echo "release_version=$release_version"
            echo "sdk=$sdk"
            echo "java=$java"
            echo "prerelease=$prerelease"
            echo "version=$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      # Only the beta path: the required checks already guard a normal release.
      - name: Check this commit tested this Ignition beta
        if: ${{ steps.ver.outputs.prerelease == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SDK: ${{ steps.ver.outputs.sdk }}
          PUBLISH: ${{ steps.ver.outputs.publish }}
        run: ops/check-beta-release.sh "$SDK" "$GITHUB_SHA" "$PUBLISH"

      - name: Build the user-manual PDF
        # Branded manual (docs/user_manual.md -> build/user_manual.pdf) via
        # scripts/build_manual_pdf.sh. Runs on dry runs too so the pipeline
        # itself stays release-gating. Attached to the release by the next job.
        env:
          MANUAL_VERSION: ${{ steps.ver.outputs.version }}
          MANUAL_IGNITION: ${{ steps.ver.outputs.sdk }}
        run: scripts/build_manual_pdf.sh

      - name: Upload the user-manual PDF
        uses: actions/upload-artifact@v7
        with:
          name: user-manual
          path: build/user_manual.pdf
          if-no-files-found: error
          # Only a hand-off to the next job; the release itself carries the PDF.
          retention-days: 1

  release:
    name: Build, sign & publish
    needs: prepare
    runs-on: ubuntu-latest
    # Normal runs take about 2 min.
    timeout-minutes: 20
    permissions:
      contents: write   # create the release + upload the asset
    steps:
      - uses: actions/checkout@v7

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ needs.prepare.outputs.java }}

      # Same Gradle and Node caching as ci.yml (see the comments there). The
      # open-source `basic` provider on purpose: this job holds the signing key.
      # A tag run reads the Gradle cache main wrote and does not write it back.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Cache Node and npm
        uses: actions/cache@v6
        with:
          path: |
            web/.gradle/nodejs
            ~/.npm
          key: node-build-${{ runner.os }}-${{ hashFiles('web/build.gradle.kts', 'web/package-lock.json') }}
          restore-keys: node-build-${{ runner.os }}-

      # Checks all five secrets up front, so a missing password or alias fails
      # here by name instead of later as an unclear Gradle signing error.
      - name: Decode signing material
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_CERT_B64: ${{ secrets.SIGNING_CERT_B64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_CERT_ALIAS: ${{ secrets.SIGNING_CERT_ALIAS }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          missing=()
          for name in SIGNING_KEYSTORE_B64 SIGNING_CERT_B64 SIGNING_KEYSTORE_PASSWORD SIGNING_CERT_ALIAS SIGNING_CERT_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Signing secrets missing: ${missing[*]}. Add them under Settings > Secrets and variables > Actions (see RELEASING.md)."
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
          printf '%s' "$SIGNING_CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.pem"

      # `build` runs jest via `check`; the e2e job on the tagged commit already
      # passed on main (branch protection guarantees it), so the release build
      # signs the artifact rather than re-booting a gateway.
      # Secrets come in through env and are quoted, so a password containing
      # `"`, `$` or a backtick reaches Gradle as-is instead of being parsed by
      # the shell.
      - name: Build & sign the module
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: "false"
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          SDK: ${{ needs.prepare.outputs.sdk }}
          JAVA_VERSION: ${{ needs.prepare.outputs.java }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          CERT_ALIAS: ${{ secrets.SIGNING_CERT_ALIAS }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          target=()
          if [ -n "$SDK" ]; then
            target=(-PignitionSdkVersion="$SDK" -PignitionJavaVersion="$JAVA_VERSION")
          fi
          ./gradlew clean build --no-daemon --stacktrace "${target[@]}" \
            -PreleaseVersion="$RELEASE_VERSION" \
            -Pignition.signing.keystoreFile="$RUNNER_TEMP/keystore.p12" \
            -Pignition.signing.keystorePassword="$KEYSTORE_PASSWORD" \
            -Pignition.signing.certFile="$RUNNER_TEMP/cert.pem" \
            -Pignition.signing.certAlias="$CERT_ALIAS" \
            -Pignition.signing.certPassword="$CERT_PASSWORD"

      - name: Locate the signed .modl
        id: modl
        run: |
          f="$(find build -maxdepth 1 -name '*.modl' ! -name '*.unsigned.modl' | head -1)"
          if [ -z "$f" ]; then echo "::error::no signed .modl produced"; exit 1; fi
          echo "path=$f" >> "$GITHUB_OUTPUT"

      - name: Verify the signature
        env:
          MODL_PATH: ${{ steps.modl.outputs.path }}
        run: |
          echo "Signed artifact: $MODL_PATH"
          # A signed Ignition .modl carries certificates.p7b + signatures.properties
          # (an unsigned one has neither) — not a JAR-style META-INF block.
          names="$(unzip -l "$MODL_PATH")"
          if echo "$names" | grep -q 'certificates.p7b' && echo "$names" | grep -q 'signatures.properties'; then
            echo "signature present (certificates.p7b + signatures.properties)"
          else
            echo "::error::.modl is not signed (missing certificates.p7b / signatures.properties)"
            exit 1
          fi

      # A beta build must never reach a gateway looking like a normal release.
      - name: Verify the beta labelling
        if: ${{ needs.prepare.outputs.prerelease == 'true' }}
        env:
          MODL_PATH: ${{ steps.modl.outputs.path }}
          SDK: ${{ needs.prepare.outputs.sdk }}
        run: |
          case "$MODL_PATH" in
            *"-ignition-$SDK.modl") ;;
            *) echo "::error::$MODL_PATH does not carry the beta SDK in its file name"; exit 1 ;;
          esac
          if ! unzip -p "$MODL_PATH" module.xml | grep -q "(BETA for Ignition $SDK)"; then
            echo "::error::module.xml does not name the module as a beta build"
            exit 1
          fi

      # Dry run (workflow_dispatch): keep the signed .modl as an artifact instead
      # of publishing — the way to confirm the signing secrets work.
      - name: Upload signed .modl (dry run)
        if: ${{ needs.prepare.outputs.publish != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: signed-modl-${{ needs.prepare.outputs.version }}
          path: ${{ steps.modl.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      # After the build on purpose: `gradlew clean` wipes build/. Runs on dry
      # runs too, so they exercise the hand-off from the prepare job.
      - name: Download the user-manual PDF
        uses: actions/download-artifact@v8
        with:
          name: user-manual
          path: build

      # A beta build has fixed notes instead of a CHANGELOG section: it ships
      # what main holds, for an Ignition version that isn't released yet.
      - name: Extract release notes
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SDK: ${{ needs.prepare.outputs.sdk }}
        run: |
          if [ -n "$SDK" ]; then
            sed "s/@SDK@/$SDK/g" ops/beta-release-notes.md > "$RUNNER_TEMP/notes.md"
          else
            python3 ops/changelog-notes.py "$VERSION" > "$RUNNER_TEMP/notes.md"
          fi

      # The tag check repeats the publish flag on purpose: `gh release create`
      # takes $GITHUB_REF_NAME as the tag, so this step must never run on a
      # branch ref, whatever the flag says.
      - name: Publish GitHub Release
        if: ${{ needs.prepare.outputs.publish == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MODL_PATH: ${{ steps.modl.outputs.path }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          SDK: ${{ needs.prepare.outputs.sdk }}
        run: |
          title="v$VERSION"
          kind=()
          if [ "$PRERELEASE" = "true" ]; then
            title="BETA for Ignition $SDK: ${VERSION%%-*}"
            kind=(--prerelease --latest=false)
          fi
          # Draft first, publish only once every asset attached — a failed
          # upload must never leave a half-public release.
          gh release create "$GITHUB_REF_NAME" \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --draft "${kind[@]}" \
            "$MODL_PATH" \
            build/user_manual.pdf
          gh release edit "$GITHUB_REF_NAME" --draft=false
