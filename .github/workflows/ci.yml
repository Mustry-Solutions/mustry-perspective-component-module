name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The defaults plus ready_for_review, so a draft that skipped the E2E jobs
    # runs them once it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # Runs every job, including the Ignition 2027 suite, for any branch on demand.
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress: only the newest
# commit can merge. Pushes to main group per commit and are never cancelled,
# because the beta release gate reads the 2027 job's result on each main commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: CI only reads the repo (no writes, no packages, etc.).
# Fork PRs already run without secrets — this keeps the token read-only too.
permissions:
  contents: read

jobs:
  # Its own step rather than folded into `./gradlew build`: lint is seconds and
  # needs no JDK, so it reports independently of the ~2 min build and keeps the
  # local inner loop unchanged. Scope is both npm projects — the components AND
  # the Playwright suite — driven from the root lint workspace (eslint.config.js).
  #
  # Lint also decides which of the other jobs a PR needs, so that decision
  # costs no extra job (GitHub bills every job by the started minute). The
  # gated jobs use job-level `if:` rather than workflow-level `paths:`: a
  # skipped job still reports its required check as passed, while a workflow
  # that never starts leaves the required checks pending and blocks the merge.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.scope.outputs.build }}
      e2e: ${{ steps.scope.outputs.e2e }}
      e2e_2027: ${{ steps.scope.outputs.e2e_2027 }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A PR checks out its merge commit; parent 1 is the base branch tip,
          # so HEAD^1..HEAD is exactly what the PR changes.
          fetch-depth: 2

      # build:    anything but docs. README.md counts as code: the Jest suite
      #           checks it against the components (docSync.test.ts).
      # e2e:      anything but docs and README.md.
      # e2e_2027: the advisory 2027 suite runs on every main commit (the beta
      #           release gate needs it there) and on demand; on a PR only when
      #           it touches what differs between the two Ignition lines: the
      #           build, the Java code compiled against the SDK, the gateway
      #           scripts or this workflow.
      - name: Decide which jobs this change needs
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Not a PR: every job runs."
            { echo "build=true"; echo "e2e=true"; echo "e2e_2027=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          build=false; e2e=false; e2e_2027=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              README.md) build=true ;;
              docs/*|.claude/*|.github/ISSUE_TEMPLATE/*|.github/CODEOWNERS|.github/dependabot.yml|*.md|LICENSE) ;;
              *) build=true; e2e=true ;;
            esac
            case "$f" in
              .github/workflows/ci.yml|ops/ignition-2027.env|ops/lib.sh|ops/e2e.sh|docker-compose.yml|*.gradle.kts|gradle/*|*.java) e2e_2027=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "build=$build e2e=$e2e e2e_2027=$e2e_2027"
          { echo "build=$build"; echo "e2e=$e2e"; echo "e2e_2027=$e2e_2027"; } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches the Node the Gradle node plugin pins for the web build
          # (web/build.gradle.kts), so lint and build never disagree on syntax.
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

  build:
    name: Build & test
    # Waits for Lint only to read its scope; `!cancelled()` keeps it running
    # when lint fails, so both results still show up on the PR.
    needs: lint
    if: ${{ !cancelled() && needs.lint.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    # Normal runs finish in ~2 min; without a cap a wedged job burns the
    # 6-hour GitHub default (observed once: a runner-side hang in job setup).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # schema guard diffs against the parent commit

      # Fail if a published props.json key was removed/renamed (existing views
      # would silently reset that setting). PRs compare against the base branch.
      - name: Prop-schema guard
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            ops/schema-guard.sh "origin/${{ github.base_ref }}"
          else
            ops/schema-guard.sh HEAD^
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Caches ~/.gradle keyed on the build files AND gradle-wrapper.properties
      # (the old hand-rolled key missed the wrapper, so a wrapper bump was
      # downloaded on every run), and validates the wrapper jar checksum.
      # `basic` is the open-source provider (plain actions/cache); the default
      # one is proprietary, and release.yml uses the same step in the job that
      # holds the signing key. It only writes the cache from main; other refs
      # read main's entry.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The node plugin downloads Node into web/.gradle/nodejs (its default
      # workDir) and npm keeps its download cache in ~/.npm. The Node version
      # is pinned in web/build.gradle.kts, so that file is part of the key.
      - name: Cache Node and npm
        uses: actions/cache@v6
        with:
          path: |
            web/.gradle/nodejs
            ~/.npm
          key: node-build-${{ runner.os }}-${{ hashFiles('web/build.gradle.kts', 'web/package-lock.json') }}
          restore-keys: node-build-${{ runner.os }}-

      # `build` depends on `check`, which runs the web Jest tests (web/build.gradle.kts).
      # The node plugin downloads its own Node; web deps install from npm + the
      # Inductive Automation nexus registry (web/.npmrc). No signing props -> the
      # module is built unsigned (skipModlSigning), which is fine for CI.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: "false"

  # Renders every component in a real Perspective session: ops/e2e.sh --fresh
  # boots the compose gateway unattended (headless commissioning, dev-signed
  # module pre-accepted via data/modules.json) and runs the Playwright smoke
  # suite in e2e/ against the committed verify project.
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    # Gated on lint as well as build: this is the expensive job (boots a real
    # gateway, ~6 min), and there's no sense spending it on a branch that
    # can't merge. Lint is a required check in its own right, so a lint
    # failure blocks the PR visibly via Lint going red — this `needs` only
    # saves the runner, it isn't the gate.
    needs: [build, lint]
    # Not on pushes to main: the ruleset requires this check on the PR with the
    # branch up to date (strict), so main receives exactly the tree that just
    # passed it. Not on drafts either; ready_for_review starts it.
    if: ${{ needs.lint.outputs.e2e == 'true' && github.event_name != 'push' && !github.event.pull_request.draft }}
    # Normal runs finish in ~16 min (gateway boot + suite); cap above that so
    # a hung boot fails fast instead of running for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Same as the build job: ops/e2e.sh --fresh builds the module again.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Its own key: this job also fills ~/.npm with the e2e/ dependencies, and
      # sharing the build job's key would hit and never save them.
      - name: Cache Node and npm
        uses: actions/cache@v6
        with:
          path: |
            web/.gradle/nodejs
            ~/.npm
          key: node-e2e-${{ runner.os }}-${{ hashFiles('web/build.gradle.kts', 'web/package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: node-e2e-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Build & test already ran the Jest suite on this commit; this rebuild
      # only needs the dev-signed .modl.
      - name: Bring up gateway and run the suite
        run: ops/e2e.sh --fresh
        env:
          MODULE_BUILD_SKIP_CHECKS: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Gateway logs on failure
        if: failure()
        run: docker logs mspc-ignition --tail 200

  # The same suite against the next Ignition line, built from its own SDK.
  # Advisory while 2027 is in beta: NOT in the required checks of the ruleset,
  # so an Inductive Automation beta change can't block main. A red run here
  # still means "don't publish a 2027 beta build from this commit" (RELEASING.md).
  # ops/ignition-2027.env is the one place that names the image and SDK.
  e2e-2027:
    name: E2E Ignition 2027 beta (advisory)
    runs-on: ubuntu-latest
    needs: [build, lint]
    # Every main commit and manual run; on a PR only when it touches the build,
    # the Java code or the gateway scripts (see the Lint job).
    if: ${{ needs.lint.outputs.e2e_2027 == 'true' && !github.event.pull_request.draft }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 2027's SDK is Java 25 bytecode: a Java 17 compiler can't read it.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Cache Node and npm
        uses: actions/cache@v6
        with:
          path: |
            web/.gradle/nodejs
            ~/.npm
          key: node-e2e-${{ runner.os }}-${{ hashFiles('web/build.gradle.kts', 'web/package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: node-e2e-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Bring up the 2027 gateway and run the suite
        run: |
          source ops/ignition-2027.env
          ops/e2e.sh --fresh
        env:
          MODULE_BUILD_SKIP_CHECKS: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-2027
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Gateway logs on failure
        if: failure()
        run: docker logs mspc-ignition-2027 --tail 200
