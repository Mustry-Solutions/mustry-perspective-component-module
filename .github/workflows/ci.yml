name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'web/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # `build` depends on `check`, which runs the web Jest tests (web/build.gradle.kts).
      # The node plugin downloads its own Node; web deps install from npm + the
      # Inductive Automation nexus registry (web/.npmrc). No signing props -> the
      # module is built unsigned (skipModlSigning), which is fine for CI.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: "false"
