name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo (no writes, no packages, etc.).
# Fork PRs already run without secrets — this keeps the token read-only too.
permissions:
  contents: read

jobs:
  # Its own step rather than folded into `./gradlew build`: lint is seconds and
  # needs no JDK, so it reports independently of the ~2 min build and keeps the
  # local inner loop unchanged. Scope is both npm projects — the components AND
  # the Playwright suite — driven from the root lint workspace (eslint.config.js).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Matches the Node the Gradle node plugin pins for the web build
          # (web/build.gradle.kts), so lint and build never disagree on syntax.
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

  build:
    name: Build & test
    runs-on: ubuntu-latest
    # Normal runs finish in ~2 min; without a cap a wedged job burns the
    # 6-hour GitHub default (observed once: a runner-side hang in job setup).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # schema guard diffs against the parent commit

      # Fail if a published props.json key was removed/renamed (existing views
      # would silently reset that setting). PRs compare against the base branch.
      - name: Prop-schema guard
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            ops/schema-guard.sh "origin/${{ github.base_ref }}"
          else
            ops/schema-guard.sh HEAD^
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'web/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # `build` depends on `check`, which runs the web Jest tests (web/build.gradle.kts).
      # The node plugin downloads its own Node; web deps install from npm + the
      # Inductive Automation nexus registry (web/.npmrc). No signing props -> the
      # module is built unsigned (skipModlSigning), which is fine for CI.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: "false"

  # Renders every component in a real Perspective session: ops/e2e.sh --fresh
  # boots the compose gateway unattended (headless commissioning, dev-signed
  # module pre-accepted via data/modules.json) and runs the Playwright smoke
  # suite in e2e/ against the committed verify project.
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    # Gated on lint as well as build: this is the expensive job (boots a real
    # gateway, ~6 min), and there's no sense spending it on a branch that
    # can't merge. Lint is a required check in its own right, so a lint
    # failure blocks the PR visibly via Lint going red — this `needs` only
    # saves the runner, it isn't the gate.
    needs: [build, lint]
    # Normal runs finish in ~6 min (gateway boot + suite); cap well above
    # that so a hung boot fails fast instead of running for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'web/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Bring up gateway and run the suite
        run: ops/e2e.sh --fresh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Gateway logs on failure
        if: failure()
        run: docker logs mspc-ignition --tail 200
