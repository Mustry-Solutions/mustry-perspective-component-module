toast.desc=Shows a toast (a short notification) at the top right of Perspective pages. Without sessionId or pageId it targets the calling page, or every page of the calling session when the script has no page (for example a session message handler). From gateway scope pass sessionId; add pageId for one page. Returns the number of pages the toast was sent to.
toast.param.message=The message text. Line breaks are kept. Required unless a title is given.
toast.param.title=Optional bold first line.
toast.param.type=info (default), success, warning or error. Case-insensitive.
toast.param.duration=Seconds before the toast closes itself (default 5). 0 keeps it open until the user closes it.
toast.param.className=Optional extra CSS classes on the toast, for project styling.
toast.param.sessionId=Optional target session id. Required from gateway scope.
toast.param.pageId=Optional target page id within the session.
toast.returns=The number of pages the toast was sent to.
